[project]
name = "main-branch"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "pillow>=13.0.0",
    "pypdf>=6.21.4",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
markers = ["real_ocr: 실제 tesseract로 OCR한다. tesseract나 언어 데이터가 없으면 건너뛴다."]

[tool.uv]
package = false
